name: Stellar Expert WASM Release

permissions:
  id-token: write
  contents: write
  attestations: write

on:
  push: 
    tags:
      - 'v*'  # triggered whenever a new tag (previxed with "v") is pushed to the repository

jobs:
  release-contract-backstop:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Blend Backstop Release'
      package: 'backstop'
      make_target: 'build'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-pool:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Blend Pool Release'
      package: 'pool'
      make_target: 'build'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-pool-factory:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Blend Pool Factory Release'
      package: 'pool-factory'
      make_target: 'build'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-treasury:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Blend Treasury Release'
      package: 'treasury'
      make_target: 'build'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-hook-allowlist:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Blend Allowlist Hook Release'
      package: 'hook-allowlist'
      make_target: 'build'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-hook-gated-liquidator:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Blend Gated Liquidator Hook Release'
      package: 'hook-gated-liquidator'
      make_target: 'build'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-contract-hook-supplier-only:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Blend Supplier-Only Hook Release'
      package: 'hook-supplier-only'
      make_target: 'build'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
