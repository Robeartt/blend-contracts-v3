[workspace]
resolver = "2"

members = [
    "backstop",
    "pool",
    "mocks/mock-pool",
    "mocks/mock-pool-factory",
    "mocks/moderc3156",
    "pool-factory",
    "treasury",
    "hooks/allowlist",
    "hooks/gated-liquidator",
    "hooks/supplier-only",
    "test-suites"
]

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.release]
opt-level = "z"
overflow-checks = true # DEV: Do not remove this check - doing so will create vulnerabilities
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.dependencies.soroban-sdk]
version = "=27.0.3"

# Blend v2 dependencies (sep-40-oracle, sep-41-token, soroban-fixed-point-math, moderc3156)
# come from forks under Robeartt. Each fork's `sdk-27` branch is the audited Blend v2
# dependency commit with only the soroban-sdk bump to 27, until upstream publishes SDK 27
# releases.
[workspace.dependencies.soroban-fixed-point-math]
git = "https://github.com/Robeartt/soroban-fixed-point-math"
branch = "sdk-27"

[workspace.dependencies.cast]
version = "0.3.0"
default-features = false

[workspace.dependencies.sep-40-oracle]
git = "https://github.com/Robeartt/sep-40-oracle"
branch = "sdk-27"

[workspace.dependencies.sep-41-token]
git = "https://github.com/Robeartt/sep-41-token"
branch = "sdk-27"

[workspace.dependencies.moderc3156]
git = "https://github.com/Robeartt/xycloans"
branch = "sdk-27"

# OpenZeppelin stellar-contracts. Pinned to a git revision: the released 0.7.2 line is on
# soroban-sdk 26, and main moved to 27 (the workspace baseline) without a release yet.
[workspace.dependencies.stellar-tokens]
git = "https://github.com/OpenZeppelin/stellar-contracts"
rev = "6ea3075d44de51ea2a0d26fa45cbee6d385731b5"

[workspace.dependencies.stellar-access]
git = "https://github.com/OpenZeppelin/stellar-contracts"
rev = "6ea3075d44de51ea2a0d26fa45cbee6d385731b5"

[workspace.dependencies.stellar-macros]
git = "https://github.com/OpenZeppelin/stellar-contracts"
rev = "6ea3075d44de51ea2a0d26fa45cbee6d385731b5"
